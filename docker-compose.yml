version: '3.8'

services:
  web:
    build: .
    container_name: yousif-portfolio
    # If the process crashes, restart it automatically
    restart: unless-stopped
    # No "ports:" on purpose: Coolify's proxy reaches the container on its
    # internal network. Publishing 5000 would expose plain HTTP on the server IP.
    expose:
      - "5000"
    volumes:
      # Only runtime state (analytics.db, recordings/) is persistent. Don't mount
      # all of /app/data: a named volume keeps its first contents forever, so
      # content.json / system-prompt.json would never update on redeploy.
      # Same volume as before, so the existing DB and recordings carry over.
      - portfolio_data:/app/data/runtime
    environment:
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}

# We define the named volume here so Docker knows it's a persistent entity
volumes:
  portfolio_data:
